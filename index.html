
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сканер штрихкодів</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f3f5;
      color: #222;
      max-width: 600px;
      margin-inline: auto;
    }

    h2 { text-align: center; }

    video {
      width: 100%;
      min-height: 220px;
      background: #111;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #1677d2;
      cursor: pointer;
    }

    button.stop { background: #b83232; }

    button:disabled {
      background: #888;
    }

    .panel {
      background: white;
      padding: 16px;
      margin-top: 14px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <h2>Сканер штрихкодів</h2>

  <video id="video" autoplay muted playsinline></video>

  <button id="startBtn">Увімкнути камеру</button>
  <button id="stopBtn" class="stop">Зупинити камеру</button>

  <div class="panel">
    Статус:
    <span id="status">Готовий до запуску</span>
  </div>

  <div class="panel">
    Останній штрихкод:
    <span class="value" id="result">—</span>
  </div>

  <div class="panel">
    Кількість сканувань:
    <span class="value" id="count">0</span>
  </div>

  <script type="module">
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const countLabel = document.getElementById("count");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let reader = null;
    let controls = null;
    let count = 0;
    let lastCode = "";
    let lastTime = 0;
    let starting = false;

    let ZXingBrowser;

    try {
      status.textContent = "Завантаження бібліотеки сканера...";

      ZXingBrowser = await import(
        "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm"
      );

      reader = new ZXingBrowser.BrowserMultiFormatReader();

      status.textContent = "Сканер готовий до роботи";
    } catch (error) {
      status.textContent =
        "Помилка завантаження бібліотеки: " + error.message;
    }

    startBtn.addEventListener("click", async () => {
      if (starting || controls) return;

      if (!reader) {
        status.textContent =
          "Бібліотека сканера не завантажилася. Оновіть сторінку.";
        return;
      }

      starting = true;
      startBtn.disabled = true;
      status.textContent = "Запускаємо камеру...";

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Браузер не підтримує доступ до камери або сторінка не HTTPS"
          );
        }

        controls = await reader.decodeFromVideoDevice(
          undefined,
          video,
          (scanResult, error) => {
            if (scanResult) {
              const code = scanResult.getText();
              const now = Date.now();

              if (
                code === lastCode &&
                now - lastTime < 1500
              ) return;

              lastCode = code;
              lastTime = now;
              count++;

              result.textContent = code;
              countLabel.textContent = count;
              status.textContent =
                "Штрихкод успішно розпізнано";
            }
          }
        );

        status.textContent =
          "Камера працює. Наведіть її на штрихкод.";

      } catch (error) {
        controls = null;
        status.textContent =
          "Помилка камери: " + error.name + " — " + error.message;
      } finally {
        starting = false;
        startBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", () => {
      if (controls) {
        controls.stop();
        controls = null;
      }

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }

      status.textContent = "Сканування зупинено";
      startBtn.disabled = false;
      starting = false;
    });
  </script>

</body>
</html>
